server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS; адрес бэкенда резолвится лениво, поэтому nginx стартует, даже если бэкенд еще поднимается
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # REST API бэкенда
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket чата и событий интерфейса
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger бэкенда: http://localhost:3000/docs
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA: любые остальные пути отдают index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
